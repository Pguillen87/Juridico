name: App CI

on:
  push:
    branches: [main, phase-3-foundation, phase-4-auth-rls]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repository Hygiene
        shell: bash
        run: |
          set -euo pipefail
          prohibited=$(git ls-files | grep -E '(^|/)(node_modules|poc/evidence|\.next|playwright-report|test-results)(/|$)|(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$prohibited" ]; then
            echo "Arquivos proibidos versionados:"
            printf '%s\n' "$prohibited"
            exit 1
          fi
          echo "Nenhum artefato proibido está versionado."

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: E2E Tests
        run: npm run e2e

      - name: Verify PoC
        run: |
          npm ci --prefix poc
          npm --prefix poc test

      - name: Create Secure Local Docker Network
        run: docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 juridico-supabase-local

      - name: Start Supabase Local
        run: |
          npx supabase start --network-id juridico-supabase-local > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            echo "Falha ao iniciar o Supabase local. Verifique os logs (credenciais omitidas)."
            cat "$RUNNER_TEMP/supabase-start.log" | grep -vE '(ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET|DB_PASSWORD|POSTGRES_PASSWORD)' || true
            exit 1
          }

      - name: Supabase DB Reset
        run: npm run db:reset

      - name: Supabase DB Lint
        run: npm run db:lint

      - name: Supabase DB Tests (pgTAP)
        run: npm run db:test

      - name: Concurrency Test (Last Owner Protection)
        run: ./supabase/tests/concurrency/test_concurrency.sh

      - name: Supabase DB Types Check
        run: |
          npm run db:types
          if [ -n "$(git status --porcelain src/types/database.types.ts)" ]; then
            echo "Tipos do banco desatualizados! Execute 'npm run db:types' localmente e versione o arquivo src/types/database.types.ts."
            exit 1
          fi

      - name: Stop Supabase Local
        if: always()
        run: npx supabase stop > /dev/null 2>&1 || true

      - name: Remove Local Docker Network
        if: always()
        run: docker network rm juridico-supabase-local > /dev/null 2>&1 || true
