name: App CI

on:
  push:
    branches:
      [
        main,
        phase-3-foundation,
        phase-4-auth-rls,
        phase-4b-auth-flows,
        phase-4c-admin-control-plane,
        phase-5-clients-parties,
        phase-6-processes-csv,
        phase-7-provider-abstraction,
        phase-8-datajud-manual,
        phase-9-scheduler-queue-snapshots,
        phase-10-comparison-detection,
        phase-11-failures-notifications,
        phase-12-weekly-reports-review-approval,
        phase-13-pdf-delivery,
      ]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret Scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk_(live|test)_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----' -- . ':(exclude)*.example' ':(exclude)*.md'; then
            echo "Possível segredo de alta confiança encontrado no conteúdo versionado."
            exit 1
          fi
          echo "Secret scan de padrões de alta confiança: PASS"

      - name: Dependency Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Phase 9 Migration History
        run: ./scripts/check-phase9-migration-history.sh

      - name: Phase 10 Migration History
        run: ./scripts/check-phase10-migration-history.sh

      - name: Phase 11 Migration History
        run: ./scripts/check-phase11-migration-history.sh

      - name: Phase 12 Migration History
        run: ./scripts/check-phase12-migration-history.sh

      - name: Phase 13 Migration History
        run: ./scripts/check-phase13-migration-history.sh

      - name: Repository Hygiene
        shell: bash
        run: |
          set -euo pipefail
          prohibited=$(git ls-files | grep -E '(^|/)(node_modules|poc/evidence|\.next|playwright-report|test-results)(/|$)|(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$prohibited" ]; then
            echo "Arquivos proibidos versionados:"
            printf '%s\n' "$prohibited"
            exit 1
          fi
          echo "Nenhum artefato proibido está versionado."

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Start Supabase Local
        run: |
          if ! npx supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Falha ao iniciar o Supabase local; saída sanitizada abaixo."
            sed -E 's/((token|password|passwd|secret|api[_-]?key)[=:][^[:space:]]+)/\1=[REDACTED]/Ig' "$RUNNER_TEMP/supabase-start.log" | tail -120
            exit 1
          fi

      - name: Supabase DB Reset
        run: npm run db:reset

      - name: Phase 11 Migration Upgrade
        run: ./scripts/test-phase11-migration-upgrade.sh

      - name: Phase 12 Migration Upgrade
        run: ./scripts/test-phase12-migration-upgrade.sh

      - name: Phase 13 Migration Upgrade
        run: ./scripts/test-phase13-migration-upgrade.sh

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Auth E2E Tests
        run: npm run auth:e2e
        env:
          JURIDICO_E2E_PASSWORD: 'TestOnly-Local-123!'

      - name: Verify PoC
        run: |
          npm ci --prefix poc
          npm --prefix poc test

      - name: Supabase DB Lint
        run: npm run db:lint

      - name: Supabase DB Tests (pgTAP)
        run: npm run db:test

      - name: Concurrency Test (Last Owner Protection)
        run: ./supabase/tests/concurrency/test_concurrency.sh

      - name: Concurrency Test (Phase 9 Scheduler Queue)
        run: ./supabase/tests/concurrency/test_phase9_concurrency.sh

      - name: Concurrency Test (Phase 10 Comparison Detection)
        run: ./supabase/tests/concurrency/test_phase10_comparison.sh

      - name: Concurrency Test (Phase 11 Failures Notifications)
        run: ./supabase/tests/concurrency/test_phase11_failures.sh

      - name: Concurrency Test (Phase 12 Weekly Reports)
        run: ./supabase/tests/concurrency/test_phase12_reports.sh

      - name: Concurrency Test (Phase 13 PDF Delivery)
        run: ./supabase/tests/concurrency/test_phase13_delivery.sh

      - name: Bootstrap Phase 13 local E2E fixture
        run: node scripts/bootstrap-phase13-e2e-fixture.mjs
        env:
          PHASE13_E2E_FIXTURE: '1'
          JURIDICO_E2E_PASSWORD: 'TestOnly-Local-123!'

      - name: Phase 13 E2E (local synthetic fixture)
        run: npx playwright test --project=phase13 tests-e2e/phase13-delivery.spec.ts
        env:
          PHASE13_E2E_FIXTURE: '1'
          PHASE13_E2E_PASSWORD: 'TestOnly-Local-123!'
          PHASE13_E2E_REPORT_ID: 'f1300000-0000-4000-c000-000000000101'
          PHASE13_E2E_ARTIFACT_ID: 'f1300000-0000-4000-e000-000000000101'

      - name: Verify PowerShell
        run: pwsh -c '$PSVersionTable'

      - name: Concurrency Test (Admin Rate Limit)
        run: pwsh -File ./scripts/test-rate-limit-concurrency.ps1

      - name: Concurrency Test (Phase 5 Confirmation)
        run: pwsh -File ./scripts/test-phase5-confirm-concurrency.ps1

      - name: Concurrency Test (Phase 6 Processes and CSV)
        run: pwsh -File ./scripts/test-phase6-concurrency.ps1

      - name: Supabase DB Types Check
        run: |
          tmp="src/types/database.types.tmp.ts"
          npx supabase gen types typescript --local > "$tmp"
          npx prettier --write "$tmp"
          if ! diff -u src/types/database.types.ts "$tmp"; then
            echo "src/types/database.types.ts está desatualizado em relação às migrations."
            echo "Gere novamente com 'npm run db:types' localmente, formate e repita o diff antes do push."
            rm -f "$tmp"
            exit 1
          fi
          rm -f "$tmp"

      - name: Stop Supabase Local
        if: always()
        run: npx supabase stop > /dev/null 2>&1 || true
