name: App CI

on:
  push:
    branches:
      [
        main,
        phase-3-foundation,
        phase-4-auth-rls,
        phase-4b-auth-flows,
        phase-4c-admin-control-plane,
        phase-5-clients-parties,
        phase-6-processes-csv,
        phase-7-provider-abstraction,
        phase-8-datajud-manual,
        phase-9-scheduler-queue-snapshots,
      ]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repository Hygiene
        shell: bash
        run: |
          set -euo pipefail
          prohibited=$(git ls-files | grep -E '(^|/)(node_modules|poc/evidence|\.next|playwright-report|test-results)(/|$)|(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$prohibited" ]; then
            echo "Arquivos proibidos versionados:"
            printf '%s\n' "$prohibited"
            exit 1
          fi
          echo "Nenhum artefato proibido está versionado."

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Start Supabase Local
        run: |
          if ! npx supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Falha ao iniciar o Supabase local; saída sensível omitida."
            exit 1
          fi

      - name: Supabase DB Reset
        run: npm run db:reset

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Auth E2E Tests
        run: npm run auth:e2e
        env:
          JURIDICO_E2E_PASSWORD: 'TestOnly-Local-123!'

      - name: Verify PoC
        run: |
          npm ci --prefix poc
          npm --prefix poc test

      - name: Supabase DB Lint
        run: npm run db:lint

      - name: Supabase DB Tests (pgTAP)
        run: npm run db:test

      - name: Concurrency Test (Last Owner Protection)
        run: ./supabase/tests/concurrency/test_concurrency.sh

      - name: Verify PowerShell
        run: pwsh -c '$PSVersionTable'

      - name: Concurrency Test (Admin Rate Limit)
        run: pwsh -File ./scripts/test-rate-limit-concurrency.ps1

      - name: Concurrency Test (Phase 5 Confirmation)
        run: pwsh -File ./scripts/test-phase5-confirm-concurrency.ps1

      - name: Concurrency Test (Phase 6 Processes and CSV)
        run: pwsh -File ./scripts/test-phase6-concurrency.ps1

      - name: Supabase DB Types Check
        run: |
          tmp="src/types/database.types.tmp.ts"
          npx supabase gen types typescript --local > "$tmp"
          npx prettier --write "$tmp"
          if ! diff -u src/types/database.types.ts "$tmp"; then
            echo "src/types/database.types.ts está desatualizado em relação às migrations."
            echo "Gere novamente com 'npm run db:types' localmente, formate e repita o diff antes do push."
            rm -f "$tmp"
            exit 1
          fi
          rm -f "$tmp"

      - name: Stop Supabase Local
        if: always()
        run: npx supabase stop > /dev/null 2>&1 || true
