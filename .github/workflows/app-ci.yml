name: App CI

on:
  push:
    branches: [main, phase-3-foundation, phase-4-auth-rls]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repository Hygiene
        shell: bash
        run: |
          set -euo pipefail
          prohibited=$(git ls-files | grep -E '(^|/)(node_modules|poc/evidence|\.next|playwright-report|test-results)(/|$)|(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$prohibited" ]; then
            echo "Arquivos proibidos versionados:"
            printf '%s\n' "$prohibited"
            exit 1
          fi
          echo "Nenhum artefato proibido está versionado."

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: E2E Tests
        run: npm run e2e

      - name: Verify PoC
        run: |
          npm ci --prefix poc
          npm --prefix poc test

      - name: Start Supabase Local
        run: npx supabase start

      - name: Supabase DB Lint
        run: npx supabase db lint

      - name: Supabase DB Tests (pgTAP)
        run: npx supabase test db

      - name: Stop Supabase Local
        run: npx supabase stop
